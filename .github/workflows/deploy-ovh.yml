name: Deploy to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_deploy:
        description: Force a full mirror to repair remote files
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ovh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload site to OVH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test incremental deployment planner
        run: python3 scripts/test-ovh-deploy-plan.py

      - name: Check purchase prices and formats
        run: python3 scripts/test-boutique.py

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp php-cli

      - name: Test shared contacts and hourly notifications
        run: php scripts/test-shared-newsletter.php

      - name: Prepare private Esprit Organic signup access
        env:
          EO_SALON_ADMIN_TOKEN: ${{ secrets.EO_SALON_ADMIN_TOKEN }}
        run: |
          python3 - <<'PYCONFIG'
          import hashlib, os, pathlib, re
          token = os.environ.get('EO_SALON_ADMIN_TOKEN', '')
          if not re.fullmatch('[a-f0-9]{64}', token):
              raise SystemExit('Missing valid EO_SALON_ADMIN_TOKEN secret')
          config = pathlib.Path('/tmp/eo-salon-config.php')
          config.write_text("<?php\nreturn ['admin_token_hash' => '" + hashlib.sha256(token.encode()).hexdigest() + "', 'newsletter_schema' => 2];\n")
          config.chmod(0o600)
          PYCONFIG

      - name: Deploy files
        env:
          FULL_DEPLOY: ${{ inputs.full_deploy || false }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_TARGET_DIR: ${{ secrets.OVH_FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          FTP_HOST="ftp.cluster128.hosting.ovh.net"
          FTP_USERNAME="cognacg-siteecgit"
          TARGET_DIR="${OVH_FTP_TARGET_DIR:-.}"
          TARGET_DIR="${TARGET_DIR%/}"
          if [ -z "${TARGET_DIR}" ]; then
            TARGET_DIR="."
          fi

          if [ -z "${OVH_FTP_PASSWORD:-}" ]; then
            echo "Missing required GitHub secret: OVH_FTP_PASSWORD"
            exit 1
          fi

          if [ "${TARGET_DIR}" = "/" ] || [ "${TARGET_DIR}" = ".." ]; then
            echo "Unsafe GitHub secret: OVH_FTP_TARGET_DIR"
            echo "Set it to the OVH directory dedicated to the new static site, never to the old WordPress directory."
            exit 1
          fi

          case "${TARGET_DIR}" in
            *..*|*ancien*|*wordpress*|*wp*)
              echo "Unsafe OVH_FTP_TARGET_DIR: ${TARGET_DIR}"
              echo "Refusing to deploy into a directory that looks like the old WordPress archive."
              exit 1
              ;;
          esac

          remote_root_list="$(
            lftp -u "${FTP_USERNAME},${OVH_FTP_PASSWORD}" "${FTP_HOST}" <<EOF
          set ftp:ssl-allow no
          set ftp:list-options -a
          set net:max-retries 2
          set net:timeout 20
          cls -1 "${TARGET_DIR}"
          bye
          EOF
          )"

          if printf '%s\n' "${remote_root_list}" | grep -E '^(wp-config\.php|wp-admin|wp-includes)$' > /dev/null; then
            echo "Unsafe OVH target: ${TARGET_DIR} contains WordPress core files."
            echo "Refusing to deploy the static site over the old WordPress installation."
            exit 1
          fi

          rm -rf _deploy
          mkdir _deploy
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='ancien-site-wordpress/' --exclude='output/' --exclude='wp-content/' \
            --exclude='AUDIT-SEO-*.md' --exclude='AGENTS.md' --exclude='README.md' \
            --exclude='build_static_site.py' --exclude='boutique.py' --exclude='data/' --exclude='__pycache__/' --exclude='scripts/' --exclude='_deploy/' \
            --exclude='newsletter-data/' --exclude='salon-config.php' \
            --exclude='*.sqlite*' --exclude='*.key' --exclude='*.token' --exclude='*.log' ./ _deploy/
          printf 'commit=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _deploy/deploy-version.txt

          if ! lftp -u "${FTP_USERNAME},${OVH_FTP_PASSWORD}" "${FTP_HOST}" <<BASELINE
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:timeout 20
          get "${TARGET_DIR}/.ovh-deploy-manifest.json" -o /tmp/ovh-baseline.json
          bye
          BASELINE
          then
            rm -f /tmp/ovh-baseline.json
          fi
          force_args=()
          if [ "$FULL_DEPLOY" = true ]; then force_args+=(--force); fi
          mode="$(python3 scripts/ovh-deploy-plan.py --bundle _deploy --baseline /tmp/ovh-baseline.json \
            --target "$TARGET_DIR" --site esprit-organic --output /tmp/ovh-transfer.lftp "${force_args[@]}")"
          if [ "$mode" = full ]; then
            cat > /tmp/ovh-transfer.lftp <<FULL_MIRROR
          mirror --reverse --verbose --parallel=2 \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob ancien-site-wordpress/** \
            --exclude-glob output/** \
            --exclude-glob wp-content/** \
            --exclude-glob "AUDIT-SEO-*.md" \
            --exclude-glob AGENTS.md \
            --exclude-glob README.md \
            --exclude-glob build_static_site.py \
            _deploy/ "${TARGET_DIR}"
          FULL_MIRROR
          fi

          lftp -u "${FTP_USERNAME},${OVH_FTP_PASSWORD}" "${FTP_HOST}" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:list-options -a
          set net:max-retries 2
          set net:timeout 20
          rm -f "${TARGET_DIR}/.ovh-deploy-manifest.json"
          source /tmp/ovh-transfer.lftp
          put /tmp/eo-salon-config.php -o "${TARGET_DIR}/api/salon-config.php"
          chmod 600 "${TARGET_DIR}/api/salon-config.php"
          put /tmp/ovh-transfer.json -o "${TARGET_DIR}/.ovh-deploy-manifest.json"
          bye
          EOF

      - name: Verify public hosts
        run: |
          set -euo pipefail

          main_headers="$(mktemp)"
          archive_headers="$(mktemp)"

          curl -fsSI --connect-timeout 8 --max-time 20 https://cognac-esprit-organic.com/ > "${main_headers}"
          curl -fsSI --connect-timeout 8 --max-time 20 https://ancien.cognac-esprit-organic.com/ > "${archive_headers}"

          grep -Eqi '^HTTP/[0-9.]+ 200|^HTTP/2 200' "${main_headers}"
          grep -Eqi '^HTTP/[0-9.]+ 200|^HTTP/2 200' "${archive_headers}"
          grep -Eqi '^x-powered-by: PHP' "${archive_headers}"
          grep -Eqi '^x-robots-tag: .*noindex' "${archive_headers}"

          version="$(curl -fsS --retry 3 --connect-timeout 8 --max-time 20 "https://cognac-esprit-organic.com/deploy-version.txt?v=$GITHUB_SHA-$GITHUB_RUN_ID")"
          grep -Fx "commit=$GITHUB_SHA" <<< "$version"

      - name: Initialize private signup storage
        env:
          EO_SALON_ADMIN_TOKEN: ${{ secrets.EO_SALON_ADMIN_TOKEN }}
        run: |
          python3 - <<'PYSTORAGE'
          import json, os, urllib.request
          origin = 'https://cognac-esprit-organic.com'
          with urllib.request.urlopen(origin + '/api/salon-contact.php?action=health', timeout=30) as response:
              health = json.load(response)
          if not health.get('ok') or health.get('status') != 'ready' or health.get('newsletter_schema') != 2:
              raise SystemExit('Signup storage is not ready')
          request = urllib.request.Request(origin + '/api/salon-admin.php', headers={
              'Authorization': 'Bearer ' + os.environ['EO_SALON_ADMIN_TOKEN'], 'Accept': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              admin = json.load(response)
          if not admin.get('ok') or admin.get('storage') != 'outside_public_root':
              raise SystemExit('Private signup administration is not ready')
          newsletter = admin.get('newsletter', {})
          if newsletter.get('schema_version') != 2 or newsletter.get('pending') != 0 or not {'phone', 'page', 'last_page'}.issubset(newsletter.get('columns', [])):
              raise SystemExit('Shared newsletter storage is not ready')
          print('Esprit Organic shared newsletter and authenticated administration ready.')
          PYSTORAGE
