name: Esprit Organic contacts and grouped notifications
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Apply retention and send eligible grouped notifications
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 30 'https://cognac-esprit-organic.com/api/salon-contact.php?action=health' > /tmp/eo-salon-health.json
          python3 - <<'PYHEALTH'
          import json
          with open('/tmp/eo-salon-health.json') as f:
              result = json.load(f)
          if not result.get('ok') or result.get('status') != 'ready':
              raise SystemExit('Private contact storage is not ready')
          if result.get('notification') == 'failed':
              raise SystemExit('Newsletter notification transport failed; pending list is retained for retry')
          print('Retention applied; eligible Esprit Organic notifications processed.')
          PYHEALTH
