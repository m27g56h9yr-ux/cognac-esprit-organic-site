name: Apply Codex publication patch

on:
  push:
    paths:
      - .github/workflows/apply-codex-publication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Codex patch and publish
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/codex.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/codex.patch.gz.b64 | gzip -d > /tmp/codex.patch
          git apply --whitespace=nowarn /tmp/codex.patch
          rm -f .github/workflows/apply-codex-publication.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Improve product SEO schema and redirects"
          git push